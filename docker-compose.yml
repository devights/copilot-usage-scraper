services:
  gh-scraper:
    build: .
    image: gh-scraper
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5000}:${PORT:-5000}"
    volumes:
      # Persist the SQLite database on the host
      - "${DATA_DIR:-./data}/usage.db:/data/usage.db"
      # Persist GitHub browser session (populated once via the login command)
      - "${DATA_DIR:-./data}/browser-state:/data/browser-state"
    environment:
      DB_PATH: /data/usage.db
      BROWSER_STATE_DIR: /data/browser-state
      SCAN_INTERVAL: "${SCAN_INTERVAL:-3600}"
      PORT: "${PORT:-5000}"

  # One-shot login helper — run with:  docker compose run --rm login
  # Then open vnc://localhost:5900 in any VNC viewer and log into GitHub.
  login:
    build: .
    image: gh-scraper
    profiles: ["login"]
    command: login
    ports:
      - "127.0.0.1:${VNC_PORT:-5900}:${VNC_PORT:-5900}"
    volumes:
      - "${DATA_DIR:-./data}/browser-state:/data/browser-state"
    environment:
      BROWSER_STATE_DIR: /data/browser-state
      VNC_PORT: "${VNC_PORT:-5900}"
