services:
  gh-scraper:
    build: .
    image: gh-scraper
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-5000}:${PORT:-5000}"
    volumes:
      # Persist the SQLite database and GitHub browser session on the host.
      # Mount the directory so SQLite can create usage.db on first startup.
      - "${DATA_DIR:-./data}:/data"
    environment:
      DB_PATH: /data/usage.db
      BROWSER_STATE_DIR: /data/browser-state
      SCAN_INTERVAL: "${SCAN_INTERVAL:-120}"
      PORT: "${PORT:-5000}"
      BIND_HOST: "0.0.0.0"

  # One-shot login helper — run with:  docker compose run --rm login
  # Then open vnc://localhost:5900 in any VNC viewer and log into GitHub.
  login:
    build: .
    image: gh-scraper
    profiles: ["login"]
    command: login
    ports:
      - "127.0.0.1:${VNC_PORT:-5900}:${VNC_PORT:-5900}"
    volumes:
      - "${DATA_DIR:-./data}:/data"
    environment:
      BROWSER_STATE_DIR: /data/browser-state
      VNC_PORT: "${VNC_PORT:-5900}"
